[project]
name = "pytm"
version = "1.4.1"
description = "A Pythonic framework for threat modeling"
authors = [{ name = "pytm Team", email = "please_use_github_issues@nowhere.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["threat modeling", "threat model", "security", "data flow diagram", "OWASP"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Natural Language :: English",
]
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
jinja = ["jinja2>=3.1,<4"]

[project.scripts]
pytm = "pytm.cli:main"

[project.urls]
Homepage = "https://github.com/OWASP/pytm"
Repository = "https://github.com/OWASP/pytm"
Issues = "https://github.com/OWASP/pytm/issues"
Changelog = "https://github.com/OWASP/pytm/blob/master/CHANGELOG.md"
"OWASP project" = "https://owasp.org/www-project-pytm/"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10.0.0",
    "black>=25.9,<27.0",
    "pdoc3>=0.11.6,<0.12.0",
    "ruff>=0.15.11,<0.16.0",
    "jinja2>=3.1,<4",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — black handles line length for reformattable code
    "UP007", # Union[X, Y] -> X | Y syntax requires Python 3.10+ at runtime
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytm"]
# Developer notes, not part of the installed package.
exclude = ["pytm/TODO.txt"]
